name: Auto Update Supreme Values

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-values:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Запуск парсера
        run: python scraper.py

      - name: Сохранение обновлений в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add values.json
            git commit -m "Автоматическое обновление цен Supreme Values"
            git push
          else
            echo "Файл values.json не изменился или парсер не вернул новые данные."
          fi
          
